<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100vw; height: 100vh; overflow: hidden; background: #000; }
    #cam { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; border: none; z-index: 1; }
    #overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; border: none; z-index: 2; pointer-events: none; }
  </style>
</head>
<body>
  <iframe id="cam" src="https://vdo.ninja" allow="autoplay;camera;microphone;fullscreen"></iframe>
  <iframe id="overlay" src="https://streamelements.com"></iframe>
</body>
</html>
